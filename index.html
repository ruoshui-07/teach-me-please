<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF4EF">
<meta name="description" content="实验室内部小页面：这周谁在做实验，师妹可以过去旁边看看。">
<meta property="og:title" content="蹲一个师姐 🐰">
<meta property="og:description" content="这周谁在做实验，我能不能去旁边看看">
<title>蹲一个师姐 · 本周谁在做实验</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sky">
  <span class="bubble b1"></span>
  <span class="bubble b2"></span>
  <span class="bubble b3"></span>
</div>

<div class="app">

  <!-- ───────── 头部 ───────── -->
  <header class="head">
    <div class="mascot" aria-hidden="true">
      <svg viewBox="0 0 96 96" width="76" height="76">
        <ellipse cx="48" cy="52" rx="30" ry="27" fill="#FFF0E6"/>
        <ellipse cx="48" cy="52" rx="30" ry="27" fill="none" stroke="#F5C7B4" stroke-width="2.5"/>
        <ellipse cx="36" cy="20" rx="7" ry="16" fill="#FFF0E6" stroke="#F5C7B4" stroke-width="2.5"
                 transform="rotate(-14 36 20)"/>
        <ellipse cx="60" cy="20" rx="7" ry="16" fill="#FFF0E6" stroke="#F5C7B4" stroke-width="2.5"
                 transform="rotate(14 60 20)"/>
        <ellipse cx="37" cy="48" rx="3.6" ry="4.6" fill="#5B4A50"/>
        <ellipse cx="59" cy="48" rx="3.6" ry="4.6" fill="#5B4A50"/>
        <circle cx="38.2" cy="46.4" r="1.3" fill="#fff"/>
        <circle cx="60.2" cy="46.4" r="1.3" fill="#fff"/>
        <path d="M44 58 q4 4 8 0" stroke="#5B4A50" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <ellipse cx="26" cy="57" rx="5" ry="3.2" fill="#FFC9D4" opacity=".85"/>
        <ellipse cx="70" cy="57" rx="5" ry="3.2" fill="#FFC9D4" opacity=".85"/>
      </svg>
    </div>
    <h1>蹲一个师姐 <span class="tiny">🥺</span></h1>
    <p class="sub">这周谁在做实验，我能不能去旁边看看</p>
    <p class="week-tag">📅 <span id="weekLabel">—</span></p>
  </header>

  <div id="demoBanner" class="demo-banner" hidden>
    🌱 演示模式：还没连数据库，填的内容只存在这台电脑上
  </div>

  <!-- ───────── Tab ───────── -->
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="teach" role="tab">
      <span class="tab-emoji">🌸</span><span>我来带</span>
    </button>
    <button class="tab" data-tab="learn" role="tab">
      <span class="tab-emoji">🐣</span><span>我想跟</span>
    </button>
  </nav>

  <!-- ───────── 我来带（师兄师姐端 · 默认）───────── -->
  <section class="panel active" id="panel-teach" role="tabpanel">

    <div class="card">
      <label class="field">
        <span class="field-label">叫我</span>
        <input id="nickTeach" type="text" maxlength="12" placeholder="昵称就行，不用真名" autocomplete="off">
      </label>
    </div>

    <div class="card">
      <h2 class="card-title"><span class="num">1</span>这周哪几个半天有空</h2>
      <div class="grid" id="gridTeach"></div>
      <p class="field-hint">点一下点亮，再点一下取消</p>
    </div>

    <div class="card">
      <h2 class="card-title"><span class="num">2</span>这段时间做什么实验</h2>
      <div class="chips" id="chipsTeach"></div>
    </div>

    <div class="card">
      <label class="field field-col">
        <span class="field-label">补充一句（可以不填）</span>
        <input id="noteTeach" type="text" maxlength="40" placeholder="例：周二上午跑胶，来了正好看">
      </label>
      <p class="field-hint">改主意随时回来点掉，不用打招呼</p>
    </div>
  </section>

  <!-- ───────── 我想跟（我的端）───────── -->
  <section class="panel" id="panel-learn" role="tabpanel">

    <div class="card">
      <h2 class="card-title"><span class="num">1</span>我哪几个半天有空</h2>
      <div class="grid" id="gridLearn"></div>
      <p class="field-hint">点一下点亮，再点一下取消</p>
    </div>

    <div class="card">
      <h2 class="card-title"><span class="num">2</span>我想学什么</h2>
      <div class="chips" id="chipsLearn"></div>
    </div>

    <div class="card">
      <label class="field field-col">
        <span class="field-label">补充说明（可以不填）</span>
        <input id="noteLearn" type="text" maxlength="40" placeholder="例：这周实验课多，周四下午才能过去">
      </label>
    </div>

    <!-- 只有我能看：口令解锁 -->
    <div class="card lock-card">
      <h2 class="card-title"><span class="num">3</span>看看这周大家填了什么 🔒</h2>

      <div id="lockPanel">
        <div class="lock-row">
          <input id="passInput" type="password" maxlength="40" placeholder="输入口令" autocomplete="current-password">
          <button class="mini-btn" id="unlockBtn">看看</button>
        </div>
        <p class="field-hint" id="lockMsg">只有你知道这个口令</p>
      </div>

      <div id="wallPanel" hidden>
        <p class="wall-hint" id="matchHint"></p>
        <div class="wall" id="wall"></div>
        <div class="lock-foot">
          <button class="mini-btn ghost" id="lockBtn">🔒 锁上</button>
          <button class="mini-btn ghost" id="copyInvite">📋 复制邀请的话</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ───────── 页脚 ───────── -->
  <footer class="foot">
    <p class="foot-note">
      只给实验室的人用 · 填的内容只有师妹能看到<br>
      made by <a href="https://github.com/ruoshui-07" target="_blank" rel="noopener">@ruoshui-07</a>
    </p>
  </footer>
</div>

<div class="toast" id="toast" aria-live="polite"></div>

<script src="data.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
